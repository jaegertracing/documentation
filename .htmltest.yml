# cSpell:ignore github
CacheExpires: 2190h # ~ 3 months
DirectoryPath: public
IgnoreAltMissing: true
IgnoreInternalEmptyHash: true # FIXME
IgnoreDirs:
  - docs/1.*
IgnoreURLs:
  - ^/docs/latest(/?|/architecture/)$
  - /livereload.js # cSpell:disable-line
  # Ignore Docsy-generated GitHub links (view-page, edit-source, create-child)
  - ^https?://github\.com/jaegertracing/documentation/(tree|edit|new)/
  # Valid URL, whether canonical (before reorg) or not (and handled via a redirect)
  - ^/docs/1.[6-9]\d/sampling/
  # Valid URLs, but servers yield 403 or similar errors
  - ^https://(twitter|x).com/[Jj]aeger[Tt]racing
  # Medium answers 403 to every automated request for an article page, browser
  # User-Agent included, so no medium.com link can be verified from CI. The blog
  # carousel links come from Medium's own RSS feed (`make fetch-blog-feed`),
  # which is not blocked, so those are generated rather than typed by hand.
  # Article images on cdn-images-1.medium.com are still checked.
  - ^https://medium.com/
  # Slack serves channel archive pages only to a signed-in browser and answers
  # a checker with 403 or 429, from CI and from a laptop alike.
  - ^https://cloud-native.slack.com/archives/
  # devops.com answers every automated request with 403.
  - ^https://devops.com/
  - ^https://calendar.google.com/
  - ^https://eng.uber.com/(distributed-tracing/)?
  - ^https://war.ukraine.ua/support-ukraine/
  - ^https://www.oracle.com/cloud
  - ^https://stackoverflow.com/questions/tagged/jaeger
  # Temporary: invalid URLs for which replacements need to be found
  # The OpenSearch Dashboard of the live demo answers 500; the other demo
  # endpoints in content/demo.md are healthy, so this is a deployment issue.
  - ^https://opensearch.demo.jaegertracing.io
  # The docs of releases up to 2.22 link to source files at paths that moved
  # before those releases were tagged, so the links were dead when the docs were
  # cut (https://github.com/jaegertracing/documentation/issues/889). The pages
  # of those releases are frozen, so the links are not checked. Later releases
  # and _dev carry corrected links and are checked.
  - ^https://github.com/jaegertracing/jaeger/(blob|tree)/v2\.([0-9]|1[0-9]|2[0-2])\.[0-9]+/
