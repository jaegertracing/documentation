{{- /* The Mermaid bundle and the init script are emitted once per page, however many diagrams it has. */ -}}
{{- if not (.Page.Store.Get "mermaid-loaded") -}}
{{- .Page.Store.Set "mermaid-loaded" true -}}
<script
  src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
  integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
  crossorigin="anonymous"></script>
<script src="{{ "js/mermaid-init.js" | relURL }}"></script>
{{- end }}
<div class="mermaid">
  {{ .Inner }}
</div>
