name: Test
# cSpell:ignore github wjdp

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with: { node-version-file: .nvmrc }
    - run: npm install
    - name: Build and check links
      run: npm run check:links:all # command also builds the site

  spellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with: { node-version-file: .nvmrc }
    - run: npm install
    - run: npm run check:spelling
    - run: npm run check:dev-links

  browser-tests:
    runs-on: ubuntu-latest
    # This image ships Chromium with its system packages, so the job does not
    # run apt-get or download a browser. Its tag must match @playwright/test
    # in package.json; renovate.json groups the two updates.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
    - uses: actions/checkout@v7
    # The checkout is owned by the runner's user, not the container's, and
    # Hugo reads Git metadata for every page.
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - run: npm install
    - run: npm run test:browser

  block-pr-from-main-branch:
    runs-on: ubuntu-latest
    steps:
    - name: Ensure PR is not on main branch
      uses: jaegertracing/jaeger/.github/actions/block-pr-from-main-branch@main
